<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>SSoT</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --ink: #1f2933; --muted: #5f6b77; --line: #e3e7ec; --panel: #f7f9fb; --accent: #1168bd; --hot: #d9480f;
    --bad: #c92a2a; --ok: #2b8a3e; --warn: #e67700;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif;
    font-size: 14px; color: var(--ink);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; }
  #app { display: grid; grid-template-columns: 280px 1fr auto; grid-template-rows: auto 1fr; height: 100%; }
  #app.nav-closed { grid-template-columns: 0 1fr auto; }
  #app.nav-closed nav { display: none; }
  header { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 8px 14px; border-bottom: 1px solid var(--line); min-height: 52px; }
  header button svg { display: block; }
  header .brand { font-weight: 700; letter-spacing: .02em; }
  #crumbs { display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; }
  #crumbs a { color: var(--accent); text-decoration: none; cursor: pointer; }
  #crumbs a:hover { text-decoration: underline; }
  #crumbs .sep { color: #aab4be; }
  #crumbs .here { font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
  #status { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); cursor: default; padding: 4px 8px; border-radius: 12px; background: var(--panel); }
  #status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
  #status.building .dot { background: var(--warn); animation: pulse 1s infinite; }
  #status.failed { color: var(--bad); cursor: pointer; }
  #status.failed .dot { background: var(--bad); }
  #status.offline .dot { background: #adb5bd; }
  @keyframes pulse { 50% { opacity: .3; } }
  .tools { display: flex; gap: 4px; }
  button { font: inherit; border: 1px solid var(--line); background: #fff; border-radius: 6px; padding: 4px 9px; cursor: pointer; color: var(--ink); }
  button:hover { background: var(--panel); }
  nav { grid-column: 1; border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  #search { margin: 10px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; font: inherit; }
  #lists { overflow: auto; flex: 1; padding-bottom: 12px; }
  nav h3 { margin: 12px 14px 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  nav a { display: block; padding: 5px 14px 5px 18px; color: var(--ink); text-decoration: none; cursor: pointer; border-left: 3px solid transparent; }
  nav a small { display: block; color: var(--muted); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  nav a .fold { display: inline-block; width: 16px; margin-left: -16px; color: var(--muted); font: 400 14px/1 Menlo, monospace; text-align: center; }
  nav a .fold:hover { color: var(--ink); }
  nav a .count { float: right; min-width: 18px; padding: 0 5px; margin-left: 6px; border-radius: 9px; background: var(--hot); color: #fff; font-size: 11px; font-weight: 600; text-align: center; line-height: 18px; }
  nav a:hover { background: #eef2f6; }
  nav a.active { border-left-color: var(--accent); background: #e7f0fa; font-weight: 600; }
  nav a.hit mark { background: #ffe8a1; color: inherit; }
  main { grid-column: 2; position: relative; overflow: hidden; background: #fbfcfd; cursor: grab; }
  main.panning { cursor: grabbing; }
  #stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #stage svg { display: block; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  #stage [data-node]:not([data-frame]), #stage [data-edge], #stage [data-header] { cursor: pointer; transition: opacity .12s; }
  #stage.focus [data-node]:not([data-frame]):not(.hot), #stage.focus [data-edge]:not(.hot) { opacity: .16; }
  #stage [data-edge].hot path[stroke="#5d6b78"], #stage [data-edge].hot path[stroke="#59636e"] { stroke: var(--hot); stroke-width: 2.6; }
  #stage [data-node].picked > :first-child { stroke: var(--hot) !important; stroke-width: 3 !important; }
  #stage .drill { cursor: pointer; }
  #stage g.drill:hover rect { filter: brightness(.82); }
  #stage tspan.drill:hover { fill: var(--hot); }
  #canvas.commenting, #canvas.commenting #stage * { cursor: crosshair; }
  #pins { position: absolute; left: 0; top: 0; }
  #canvas.commenting #pins .pin { cursor: pointer; }
  #pins .pin { position: absolute; width: 28px; height: 28px; margin-top: -28px; padding: 0; border: 2px solid #fff; border-radius: 50% 50% 50% 3px; background: var(--accent); color: #fff; font: 700 12px/24px -apple-system, sans-serif; text-align: center; box-shadow: 0 2px 6px rgba(0,0,0,.3); cursor: pointer; }
  #pins .pin.waiting { background: var(--hot); }
  #pins .pin.asked { background: #fff; color: var(--accent); border-color: var(--accent); }
  #pins .pin.resolved { background: var(--ok); }
  #pins .pin.stale::after { content: ""; position: absolute; right: -4px; top: -4px; width: 9px; height: 9px; border-radius: 50%; background: var(--warn); border: 2px solid #fff; }
  #pins .pin.orphan { background: #adb5bd; border-style: dashed; }
  #pins .pin.active { z-index: 1; outline: 3px solid rgba(17,104,189,.3); }
  #pop { position: absolute; display: none; z-index: 6; width: 300px; max-height: calc(100% - 16px); overflow: auto; padding: 10px 12px 10px; background: #fff; border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 28px rgba(0,0,0,.18); cursor: default; }
  #pop .thread { margin: 0; padding: 0; border: 0; opacity: 1; }
  #commentTool.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  #legend { position: absolute; left: 12px; bottom: 38px; z-index: 3; max-width: calc(100% - 24px); max-height: 45%; overflow: auto; background: #fff; border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.08); cursor: default; }
  #legend.none { display: none; }
  #legendBar { display: flex; align-items: center; gap: 6px; width: 100%; padding: 4px 10px; border: 0; border-radius: 0; background: none; font-size: 12px; color: var(--muted); text-align: left; }
  #legend.closed #legendBody { display: none; }
  #legendBody svg { display: block; }
  #hint { position: absolute; left: 12px; bottom: 10px; font-size: 12px; color: var(--muted); background: rgba(255,255,255,.85); padding: 4px 8px; border-radius: 6px; pointer-events: none; }
  #tip { position: absolute; pointer-events: none; max-width: 360px; background: #1f2933; color: #fff; font-size: 12.5px; padding: 6px 9px; border-radius: 6px; display: none; z-index: 5; line-height: 1.45; }
  #tip b { color: #ffd8a8; }
  aside { grid-column: 3; width: 0; overflow: hidden; border-left: 1px solid var(--line); background: #fff; }
  aside.open { width: 360px; overflow: auto; }
  aside .inner { padding: 14px 16px 24px; width: 360px; }
  aside h2 { margin: 0 0 2px; font-size: 18px; }
  aside .kind { color: var(--muted); font-size: 12.5px; margin-bottom: 10px; }
  aside p { margin: 8px 0 12px; line-height: 1.55; }
  aside dl { display: grid; grid-template-columns: 96px 1fr; gap: 4px 10px; margin: 0 0 12px; font-size: 13px; }
  aside dt { color: var(--muted); }
  aside dd { margin: 0; word-break: break-word; }
  aside .links a { display: block; margin: 4px 0; color: var(--accent); cursor: pointer; text-decoration: none; }
  aside .links a:hover { text-decoration: underline; }
  aside .close { float: right; }
  aside .rel { border-top: 1px solid var(--line); padding: 8px 0; font-size: 13px; }
  aside .threads h3 { margin: 2px 0 8px; font-size: 18px; }
  aside .threads .how, aside .threads .none { color: var(--muted); line-height: 1.5; }
  .composer { position: relative; margin-top: 6px; }
  .composer textarea { display: block; width: 100%; min-height: 36px; max-height: 240px; padding: 8px 40px 8px 10px; border: 1px solid var(--line); border-radius: 8px; font: inherit; line-height: 1.5; resize: none; field-sizing: content; }
  .composer textarea:focus { outline: 2px solid #b6d4f5; border-color: var(--accent); }
  .composer .send { position: absolute; right: 6px; bottom: 6px; width: 26px; height: 26px; padding: 0; border: 0; border-radius: 50%; background: var(--accent); color: #fff; font-size: 14px; line-height: 26px; }
  .composer .send:hover { background: #0d5aa7; }
  .composer.bare textarea { border-color: transparent; padding-left: 2px; }
  .thread { border: 1px solid var(--line); border-left: 3px solid var(--hot); border-radius: 6px; padding: 8px 10px 0; margin-bottom: 10px; }
  .thread.answered { border-left-color: var(--accent); }
  .thread.resolved { border-left-color: var(--ok); opacity: .75; }
  .thread .head { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .thread .head .chip { margin-left: auto; padding: 1px 7px; border-radius: 9px; background: #eef2f6; color: var(--ink); }
  .thread .head .chip.waiting { background: #fff0e6; color: var(--hot); }
  .thread .head .chip.resolved { background: #e9f6ec; color: var(--ok); }
  .thread .head .icon { border: 0; background: none; padding: 1px 5px; color: var(--muted); font-size: 13px; }
  .thread .head .icon:hover { background: #eef2f6; color: var(--ink); }
  .thread .notice { margin: 6px 0 2px; padding: 4px 8px; border-radius: 6px; background: #fff8e6; color: #8a5300; font-size: 12px; }
  .thread .notice.orphan { background: #f1f3f5; color: var(--muted); }
  .where { display: block; margin: 3px 0 6px; color: var(--muted); font-size: 12.5px; text-decoration: none; }
  a.where { color: var(--accent); cursor: pointer; }
  a.where:hover { text-decoration: underline; }
  .msg { position: relative; margin: 6px 0 8px; font-size: 13px; }
  .msg .ops { position: absolute; right: 0; top: -2px; display: none; gap: 2px; }
  .msg:hover .ops { display: flex; }
  .msg .ops button { border: 0; background: none; padding: 1px 5px; color: var(--muted); font-size: 12px; }
  .msg .ops button:hover { background: #eef2f6; color: var(--ink); }
  .msg.gone .text { color: var(--muted); font-style: italic; }
  .msg .edited { color: var(--muted); font-size: 11.5px; margin-left: 4px; }
  .msg b { margin-right: 6px; }
  .msg.agent b { color: var(--accent); }
  .msg time { color: var(--muted); font-size: 11.5px; }
  .msg .text { margin-top: 2px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
  .resolved-toggle { display: block; margin: 4px 0 10px; color: var(--muted); font-size: 12.5px; cursor: pointer; }
  #threadsToggle { display: flex; align-items: center; gap: 5px; }
  #threadsToggle.waiting { border-color: var(--hot); color: var(--hot); }
  #problems { position: absolute; left: 12px; right: 12px; top: 12px; max-height: 45%; overflow: auto; background: #fff5f5; border: 1px solid #ffc9c9; color: #7d1414; border-radius: 8px; padding: 10px 14px; font: 12px/1.5 ui-monospace, Menlo, monospace; white-space: pre-wrap; display: none; z-index: 4; }
  #problems h4 { margin: 0 0 6px; font: 600 13px -apple-system, sans-serif; }
  #empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); }
</style>
</head>
<body>
<div id="app">
  <header>
    <button id="navToggle" title="收起或展开侧栏 (B)" aria-label="收起或展开侧栏"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="1.5" y="2.5" width="13" height="11" rx="2"/><path d="M6 2.5v11"/></svg></button>
    <span class="brand">SSoT</span>
    <div id="crumbs"></div>
    <div class="tools">
      <button id="zoomOut" title="缩小 (-)">−</button>
      <button id="zoomReset" title="实际大小 (0)">100%</button>
      <button id="zoomIn" title="放大 (+)">+</button>
      <button id="fit" title="适应窗口 (F)">适应</button>
      <button id="download" title="下载当前图的 SVG">SVG</button>
      <button id="commentTool" title="批注工具：开着时点图上任意位置落一条批注 (C)">批注</button>
    </div>
    <button id="threadsToggle" title="全部批注"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M2.5 3.5h11v7.5h-6l-3 2.5v-2.5h-2z"/></svg><span id="threadCount">0</span></button>
    <div id="status" title=""><span class="dot"></span><span id="statusText">连接中</span></div>
  </header>
  <nav>
    <input id="search" placeholder="搜索图与元素（/）" autocomplete="off">
    <div id="lists"></div>
  </nav>
  <main id="canvas">
    <div id="stage"></div>
    <div id="empty">正在构建…</div>
    <div id="problems"></div>
    <div id="tip"></div>
    <div id="pop"></div>
    <div id="legend"><button id="legendBar" title="收起或展开图例 (L)"><span id="legendFold">▾</span>图例</button><div id="legendBody"></div></div>
    <div id="hint">拖动平移 · 滚轮平移 / ⌘ 或 Ctrl + 滚轮缩放 · 单击看详情 · 点图上的标注或双击下钻 · 按 C 后点图上任意位置批注，或在那里右键 · B 收起侧栏 · Esc 取消</div>
  </main>
  <aside id="details"><div class="inner"></div></aside>
</div>
<script>
"use strict";
const KIND_TITLES = { view: "C4 视图", deployment: "部署", layers: "契约", box: "契约", promises: "契约", types: "契约", access: "契约", wirings: "接线", composition: "接线", properties: "接线" };
const $ = (id) => document.getElementById(id);
const canvas = $("canvas"), stage = $("stage"), details = $("details"), tip = $("tip");
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

let site = null;                 // /api/site 的最近一次结果
let current = null;              // 当前图
let selected = null;             // { type: "node" | "edge", id }
const views = new Map();         // 图 id → { x, y, scale }：每张图各自记住视野，重画后不跳
let threads = [];                // /api/threads 的最近一次结果：使用者留的批注与 agent 的回复
let commenting = false;          // 批注工具开着：点画布任意位置落一条批注
let popped = null;               // 画布上开着的气泡：{ kind: "new", anchor } 写一条新的，{ kind: "thread", id } 看一条已有的
let editing = null;              // 正在改的那句话：{ thread, message }
let popAt = null;                // 气泡指着的落点（图的坐标）
let listOpen = false;            // 没有选中元素时，右栏是否列出全部批注
let showResolved = false;
const drafts = new Map();        // 输入框的键 → 还没发出的字；右栏随时会重画，字不能丢

// ---------- 路由：#/<图 id>?node=<节点 id> ----------
function parseHash() {
  const raw = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
  const [id, query] = raw.split("?");
  const node = new URLSearchParams(query ?? "").get("node");
  return { id: id || null, node };
}
function go(id, node = null, replace = false) {
  const hash = `#/${encodeURIComponent(id)}${node ? `?node=${encodeURIComponent(node)}` : ""}`;
  if (replace) history.replaceState(null, "", hash); else if (location.hash !== hash) history.pushState(null, "", hash);
  route();
}
window.addEventListener("popstate", route);

function route() {
  if (!site || site.diagrams.length === 0) return;
  const { id, node } = parseHash();
  const diagram = site.diagrams.find((d) => d.id === id) ?? site.diagrams[0];
  // 走到一张图时展开它在侧栏树里的各级上级，否则当前图会藏在收起的分支里。
  if (diagram.id !== revealed) {
    revealed = diagram.id;
    for (let d = diagram; d?.parent; d = site.diagrams.find((x) => x.id === d.parent)) folded.delete(d.parent);
    localStorage.setItem("ssot.folded", JSON.stringify([...folded]));
  }
  // 选中状态先按地址定下来再画图：详情面板的开合会改变画布宽度，适应窗口要按最终宽度算。
  const pick = node && diagram.items[node] ? { type: "node", id: node } : null;
  if (!current || current !== diagram) { selected = pick; renderDetails(); show(diagram); }
  else select(pick);
  if (pick) centerOn(pick.id);
}

// ---------- 侧栏 ----------
// 整栏的开合与树上收起的分支记在 localStorage：它们是这个浏览器里的看图习惯，不属于设计。
const folded = new Set(JSON.parse(localStorage.getItem("ssot.folded") ?? "[]"));
let revealed = null;             // 最近一次为它展开过上级的图
function setNav(open) {
  const before = canvas.getBoundingClientRect().left;
  $("app").classList.toggle("nav-closed", !open);
  localStorage.setItem("ssot.nav", open ? "open" : "closed");
  // 画布的左边界跟着移动；每张图的视野补上这段位移，图在屏幕上不跳。
  const shift = before - canvas.getBoundingClientRect().left;
  for (const [id, v] of views) views.set(id, { ...v, x: v.x + shift });
  apply();
}
$("app").classList.toggle("nav-closed", localStorage.getItem("ssot.nav") === "closed");
$("navToggle").onclick = () => setNav($("app").classList.contains("nav-closed"));
function renderLists(filter = "") {
  const q = filter.trim().toLowerCase();
  const lists = $("lists");
  let html = "";
  // 每张图上未解决的批注数。
  const counts = new Map();
  for (const t of threads) if (t.status === "open" && spoken(t).length) counts.set(t.anchor.diagram, (counts.get(t.anchor.diagram) ?? 0) + 1);
  const count = (d) => counts.has(d.id) ? `<span class="count" title="未解决的批注">${counts.get(d.id)}</span>` : "";
  const entry = (d, depth, parent) => `<a data-go="${esc(d.id)}" class="${current?.id === d.id ? "active" : ""}" style="padding-left:${32 + depth * 16}px">${count(d)}${parent ? `<span class="fold" data-fold="${esc(d.id)}" title="${folded.has(d.id) ? "展开" : "收起"}下一层">${folded.has(d.id) ? "▸" : "▾"}</span>` : ""}${esc(d.title)}<small>${esc(d.id)}</small></a>`;
  // 不搜索时按上下级排成树：每张图缩进在它的上一级图下面，只有顶层的图分组加标题。
  if (!q) {
    const all = site?.diagrams ?? [], ids = new Set(all.map((d) => d.id)), children = new Map(), roots = [];
    for (const d of all) {
      if (d.parent && ids.has(d.parent)) { if (!children.has(d.parent)) children.set(d.parent, []); children.get(d.parent).push(d); }
      else roots.push(d);
    }
    const walk = (d, depth) => {
      const below = children.get(d.id) ?? [];
      html += entry(d, depth, below.length > 0);
      if (!folded.has(d.id)) for (const c of below) walk(c, depth + 1);
    };
    let heading = null;
    for (const r of roots) {
      if (KIND_TITLES[r.kind] !== heading) { heading = KIND_TITLES[r.kind]; html += `<h3>${esc(heading)}</h3>`; }
      walk(r, 0);
    }
    lists.innerHTML = html;
    return;
  }
  const groups = new Map();
  for (const d of site?.diagrams ?? []) {
    const title = KIND_TITLES[d.kind];
    if (!groups.has(title)) groups.set(title, []);
    groups.get(title).push(d);
  }
  const mark = (text) => q ? esc(text).replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "ig"), (m) => `<mark>${m}</mark>`) : esc(text);
  for (const [title, diagrams] of groups) {
    const shown = q ? diagrams.filter((d) => `${d.title} ${d.id}`.toLowerCase().includes(q)) : diagrams;
    if (shown.length === 0) continue;
    html += `<h3>${esc(title)}</h3>`;
    for (const d of shown) html += `<a data-go="${esc(d.id)}" class="${current?.id === d.id ? "active" : ""} ${q ? "hit" : ""}">${count(d)}${mark(d.title)}<small>${esc(d.id)}</small></a>`;
  }
  if (q) {
    const hits = [];
    for (const d of site?.diagrams ?? []) for (const [id, item] of Object.entries(d.items))
      if (`${item.title} ${item.kind} ${item.description} ${id}`.toLowerCase().includes(q)) hits.push({ d, id, item });
    if (hits.length) {
      html += `<h3>元素</h3>`;
      for (const { d, id, item } of hits.slice(0, 80)) html += `<a class="hit" data-go="${esc(d.id)}" data-node="${esc(id)}">${mark(item.title)}<small>${esc(d.title)} · ${esc(item.kind)}</small></a>`;
    }
    if (!html) html = `<h3>没有匹配</h3>`;
  }
  lists.innerHTML = html;
}
$("lists").addEventListener("click", (e) => {
  const fold = e.target.closest("[data-fold]");
  if (fold) {
    if (!folded.delete(fold.dataset.fold)) folded.add(fold.dataset.fold);
    localStorage.setItem("ssot.folded", JSON.stringify([...folded]));
    return renderLists($("search").value);
  }
  const a = e.target.closest("a[data-go]");
  if (a) go(a.dataset.go, a.dataset.node ?? null);
});
$("search").addEventListener("input", (e) => renderLists(e.target.value));
$("search").addEventListener("keydown", (e) => {
  if (e.key === "Enter") { const first = $("lists").querySelector("a[data-go]"); if (first) go(first.dataset.go, first.dataset.node ?? null); }
  if (e.key === "Escape") { e.target.value = ""; renderLists(); e.target.blur(); }
});

// ---------- 面包屑 ----------
function renderCrumbs() {
  const chain = [];
  for (let d = current; d; d = d.parent ? site.diagrams.find((x) => x.id === d.parent) : null) chain.unshift(d);

$("crumbs").addEventListener("click", (e) => { const a = e.target.closest("a[data-go]"); if (a) go(a.dataset.go); });

// ---------- 画布：平移与缩放 ----------
function viewOf(d) { return views.get(d.id); }
function apply() {

  if (!svg) return;
  svg.style.width = `${current.width * v.scale}px`;
  svg.style.height = `${current.height * v.scale}px`;
  stage.style.transform = `translate(${v.x}px, ${v.y}px)`;

let drag = null;
canvas.addEventListener("pointerdown", (e) => {

$("zoomIn").onclick = () => zoomCenter(1.25);

// ---------- 图例：画布之外的浮层，不随图平移缩放 ----------

// ---------- 显示一张图 ----------
function show(diagram) {

// ---------- 悬停：高亮相连的线与节点 ----------
function targetOf(e) {

  e = { target: el };
  // 图上的下钻标注（SVG 里 class="drill"）：打开下一层的图，并定位到其中的节点。

  const edge = e.target.closest?.("[data-edge]");

  } else if (t.type === "edge") {

}

  if (t && t.type !== "drill") {

    tip.style.left = `${Math.min(e.clientX - r.left + 14, r.width - 370)}px`;

canvas.addEventListener("pointerleave", () => { hovered = null; tip.style.display = "none"; paint(selected); });
function tipText(t) {

// ---------- 单击选中、双击下钻 ----------

// ---------- 批注 ----------
// 批注直接落在画布上：批注工具开着时点图上任意一处（或在那里右键），落点旁边开一个输入框；落下的批注是叠在图上的一枚图钉，点它打开对话。
// 落在节点或箭头上的记相对位置与那个元素当时的内容指纹 rev，重画后跟着元素走；元素后来改了图钉带个点（stale），
// 元素没了图钉退回落下时的位置并变灰（orphan）。落在空白处的记图的坐标和当时最近的几个节点。
const nodeEl = (id) => stage.querySelector(`svg [data-node="${CSS.escape(id)}"]`);
const rounded = (n, digits) => Number(n.toFixed(digits));

function edgeIndex(d, a) {

  for (let i = 0; i < d.edges.length; i++) if (d.edges[i].source === a.source && d.edges[i].target === a.target && seen++ === a.ordinal) return i;
  return -1;
}

function anchorAt(e) {

  const index = Number(hit?.closest("[data-edge]")?.dataset.edge ?? -1), model = current.edges[index], path = model ? svg.querySelector(`[data-edge="${index}"] path`) : null;
  if (path) {
    const ctm = path.getScreenCTM(), length = path.getTotalLength();
    let ordinal = 0, along = 0, nearest = Infinity;
    for (let i = 0; i < index; i++) if (current.edges[i].source === model.source && current.edges[i].target === model.target) ordinal++;
    // 沿线取 65 个点，离指针最近的那个就是落点。
    for (let i = 0; i <= 64; i++) {
      const p = path.getPointAtLength(length * i / 64).matrixTransform(ctm), far = Math.hypot(p.x - e.clientX, p.y - e.clientY);

  }

  const el = id !== undefined && current.items[id] ? nodeEl(id) : null;
  if (el) {
    const b = el.getBoundingClientRect(), clamp = (n) => rounded(Math.min(1, Math.max(0, n)), 3);
    return { kind: "node", diagram: current.id, node: id, dx: clamp((e.clientX - b.left) / b.width), dy: clamp((e.clientY - b.top) / b.height), at: pointOf(e), rev: current.items[id].rev };
  }

    const b = n.getBoundingClientRect();
    return { id: n.dataset.node, far: Math.hypot(Math.max(b.left - e.clientX, 0, e.clientX - b.right), Math.max(b.top - e.clientY, 0, e.clientY - b.bottom)) };

  const near = [];

/** 指针在当前图上的坐标。 */
function pointOf(e) {

  if (a.kind === "point") return a.at;
  const svg = stage.querySelector("svg");
  let at = null;
  if (a.kind === "node") {
    const el = current.items[a.node] ? nodeEl(a.node) : null;
    if (el) { const b = el.getBoundingClientRect(); at = { x: b.left + a.dx * b.width, y: b.top + a.dy * b.height }; }
  } else {
    const index = edgeIndex(current, a), path = index < 0 ? null : svg.querySelector(`[data-edge="${index}"] path`);

  if (!at) return a.at;

}
/** 落点用一句话说是哪里：给气泡与全部批注的索引。 */
function anchorLabel(a) {
  const d = site.diagrams.find((x) => x.id === a.diagram);
  if (!d) return `${a.diagram}（现在的设计里没有这张图）`;
  const name = (id) => d.items[id]?.title ?? id;
  if (a.kind === "point") return `${d.title} › 空白处${a.near.length ? `，靠近 ${a.near.map(name).join("、")}` : ""}`;

}
/** 还在的话；话全删了的批注哪里都不再显示。 */
const spoken = (t) => t.messages.filter((m) => m.content.kind === "text");
/** 一条批注在等谁：已解决或者话全删了不等谁；否则最后一句还在的话是使用者说的，就在等 agent。 */
function waitingOn(t) {

}
function when(at) {

}
const STATUS_CHIP = { agent: ["waiting", "等 Agent"], human: ["", "等你"], null: ["resolved", "已解决"] };
const NOTICE = { stale: ["", "批注之后这里改过"], orphan: ["orphan", "批注指着的元素已经不在图上"] };
/** 一条批注：头部（编号、在等谁、解决或重新打开）、元素后来的变化、落点、对话、回复框。link：落点写成能点过去的链接（索引里）。 */
function threadHtml(t, link) {

  const state = d ? standing(d, t.anchor) : "orphan", where = esc(anchorLabel(t.anchor));
  let html = `<div class="thread ${waiting === "agent" ? "" : waiting === "human" ? "answered" : "resolved"}"><div class="head"><span>${esc(t.id)}</span><span class="chip ${chipClass}">${chip}</span>`;
  html += t.status === "open" ? `<button class="icon" data-status="${esc(t.id)}" data-to="resolved" title="标为已解决">✓</button>` : `<button class="icon" data-status="${esc(t.id)}" data-to="open" title="重新打开">↺</button>`;
  if (!link) html += `<button class="icon" data-pop-close title="关闭 (Esc)">✕</button>`;
  html += `</div>`;
  if (state !== "fresh") html += `<div class="notice ${NOTICE[state][0]}">${NOTICE[state][1]}</div>`;
  html += link ? `<a class="where" data-open-thread="${esc(t.id)}">${where}</a>` : `<div class="where">${where}</div>`;
  for (const m of t.messages) {
    const mine = m.author === "human" && m.content.kind === "text", key = `edit|${t.id}|${m.id}`;
    html += `<div class="msg ${m.author}${m.content.kind === "deleted" ? " gone" : ""}"><b>${m.author === "human" ? "你" : "Agent"}</b><time>${when(m.at)}</time>`;
    if (m.content.kind === "text" && m.content.editedAt) html += `<span class="edited">（已编辑）</span>`;
    if (mine && !(editing?.thread === t.id && editing.message === m.id)) html += `<span class="ops"><button data-edit="${esc(t.id)}|${esc(m.id)}">编辑</button><button data-delete="${esc(t.id)}|${esc(m.id)}">删除</button></span>`;
    if (m.content.kind === "deleted") html += `<div class="text">（已删除）</div>`;
    else if (editing?.thread === t.id && editing.message === m.id) html += composer(key, "", "保存 (⌘↵)");
    else html += `<div class="text">${esc(m.content.text)}</div>`;
    html += `</div>`;
  }
  return html + composer(`reply|${t.id}`, "回复…", "发送 (⌘↵)", true) + `</div>`;
}
/** 输入框加圆形发送键；⌘ 或 Ctrl + Enter 也发出，Esc 放弃。 */
function composer(key, placeholder, title, bare = false) {
  return `<div class="composer${bare ? " bare" : ""}"><textarea data-draft="${esc(key)}" rows="1" placeholder="${esc(placeholder)}">${esc(drafts.get(key) ?? "")}</textarea><button class="send" data-send="${esc(key)}" title="${esc(title)}">↑</button></div>`;
}
/** 右栏的全部批注：当前这张图的排在前面，点落点跳到图上那枚图钉。 */
function listHtml() {
  const listed = threads.filter((t) => spoken(t).length).sort((a, b) => (b.anchor.diagram === current.id) - (a.anchor.diagram === current.id));
  const open = listed.filter((t) => t.status === "open"), resolved = listed.filter((t) => t.status === "resolved");
  let html = `<div class="threads"><h3>全部批注</h3><p class="how">按 C 打开批注工具再点图上任意位置，或者直接在那里右键：节点、箭头或空白处都可以。</p>`;
  for (const t of open) html += threadHtml(t, true);
  if (resolved.length) {
    html += `<label class="resolved-toggle"><input type="checkbox" id="showResolved"${showResolved ? " checked" : ""}> 已解决 ${resolved.length} 条</label>`;
    if (showResolved) for (const t of resolved) html += threadHtml(t, true);
  }
  if (listed.length === 0) html += `<p class="none">还没有批注。</p>`;
  return html + `</div>`;
}
/** 在落点旁边开气泡（next 的两种形状见 popped）；null：收起。 */
function pop(next) {
  popped = next;
  renderPop();
  renderPins();
  if (popped?.kind === "new") $("pop").querySelector("textarea").focus();
}
/** 在指针处开一个新批注的输入框。 */
function compose(e) {
  pop({ kind: "new", anchor: anchorAt(e) });
}
/** 按 popped 画气泡；它的落点不在当前这张图上（换了图，或指着的元素没了）时收起。 */
function renderPop() {
  const box = $("pop"), thread = popped?.kind === "thread" ? threads.find((t) => t.id === popped.id) : null;
  const anchor = !current || !popped ? null : popped.kind === "new" ? popped.anchor : thread?.anchor ?? null;
  popAt = anchor && anchor.diagram === current.id ? spot(anchor) : null;
  if (!popAt) { popped = null; box.style.display = "none"; box.innerHTML = ""; return; }
  refill(box, popped.kind === "new"
    ? `<div class="where">${esc(anchorLabel(anchor))}</div>${composer("new", "添加批注…", "批注 (⌘↵)")}`
    : threadHtml(thread, false));
  box.style.display = "block";
  placePop();
}
/** 气泡跟着平移缩放走：新批注的输入框开在落点右下，已有批注开在图钉右侧；右边放不下就开在左侧，上下贴着画布边缘收住。 */
function placePop() {
  if (!popped || !popAt || !current) return;
  const box = $("pop"), v = viewOf(current), r = canvas.getBoundingClientRect(), x = v.x + popAt.x * v.scale, y = v.y + popAt.y * v.scale;
  const right = popped.kind === "new" ? x + 18 : x + 38, left = x - 10 - box.offsetWidth;
  box.style.left = `${Math.max(8, right + box.offsetWidth > r.width - 8 ? left : right)}px`;
  box.style.top = `${Math.max(8, Math.min(popped.kind === "new" ? y + 18 : y - 30, r.height - box.offsetHeight - 8))}px`;
}
/**
 * 当前图上每条未解决的批注一枚图钉，写着它的编号：橙色在等 agent，蓝色是 agent 回过了，白底蓝字是 agent 落下来问你的；
 * 元素后来改了右上角带个点，元素没了变灰。已解决的只在打开着时显示。
 */
function renderPins() {
  const layer = $("pins");
  if (!layer || !current) return;
  let html = "";
  for (const t of threads) {
    const said = spoken(t), active = popped?.kind === "thread" && popped.id === t.id;
    const at = said.length && t.anchor.diagram === current.id && (t.status === "open" || active) ? spot(t.anchor) : null;
    if (!at) continue;
    const waiting = waitingOn(t), state = standing(current, t.anchor);
    const kind = [waiting === null ? "resolved" : waiting === "agent" ? "waiting" : said[0].author === "agent" && said.length === 1 ? "asked" : "answered", state === "fresh" ? "" : state, active ? "active" : ""].join(" ");
    html += `<button class="pin ${kind}" data-pin="${esc(t.id)}" data-x="${at.x}" data-y="${at.y}" title="${esc(said[0].content.text)}">${esc(t.id.slice(1))}</button>`;
  }
  layer.innerHTML = html;
  placePins();
}
function placePins() {
  const layer = $("pins");
  if (!layer || !current) return;
  const scale = viewOf(current).scale;
  for (const p of layer.children) { p.style.left = `${p.dataset.x * scale}px`; p.style.top = `${p.dataset.y * scale}px`; }
}
/** 从全部批注里点一条：换到它那张图，把图钉移到画布中间并打开气泡。 */
function openThread(id) {
  const t = threads.find((x) => x.id === id);
  if (!t || !site.diagrams.some((d) => d.id === t.anchor.diagram)) return;
  popped = { kind: "thread", id };
  go(t.anchor.diagram);
  renderPop();
  renderPins();
  if (!popAt) return;
  const r = canvas.getBoundingClientRect(), v = viewOf(current);
  views.set(current.id, { ...v, x: r.width / 2 - popAt.x * v.scale, y: r.height / 2 - popAt.y * v.scale });
  apply();
}
/** 发出一个输入框里的字：新批注落在气泡指着的落点；回复落在那条批注下面；编辑换掉那句话。 */
async function send(key) {
  const text = (drafts.get(key) ?? "").trim();
  if (!text) return;
  const [verb, thread, message] = key.split("|");
  if (verb === "reply") return post({ kind: "reply", thread, author: "human", text }, () => drafts.delete(key));
  if (verb === "edit") return post({ kind: "edit", thread, message, author: "human", text }, () => { drafts.delete(key); editing = null; });
  if (popped?.kind !== "new") return;
  // 发出之后收起输入框、关掉批注工具，图上多一枚图钉。
  return post({ kind: "open", anchor: popped.anchor, author: "human", text }, () => { drafts.delete(key); popped = null; setCommenting(false); });
}
/** 把一次改动交给 ssot serve；成功后先执行 done 再按返回的批注重画。 */
async function post(change, done = () => {}) {
  let response, answer;
  try {
    response = await fetch("/api/threads", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(change) });
    answer = await response.json();
  } catch {
    return alert("没有发出去：ssot serve 没有回应");
  }
  if (!response.ok) return alert(`没有发出去：${answer.error}`);
  done(answer.threads);
  setThreads(answer.threads);
}
function setThreads(next) {
  threads = next;
  const open = threads.filter((t) => t.status === "open" && spoken(t).length);
  $("threadCount").textContent = open.length;
  $("threadsToggle").classList.toggle("waiting", open.some((t) => waitingOn(t) === "agent"));
  renderPop();
  renderPins();
  renderLists($("search").value);
  renderDetails();
}
async function loadThreads() { setThreads((await (await fetch("/api/threads")).json()).threads); }
/** 气泡与右栏里的批注共用的点击：发出、改状态、改或删自己的话、跳到图钉。处理了返回 true。 */
function threadClick(e) {
  const send_ = e.target.closest("[data-send]"), status = e.target.closest("[data-status]"), open = e.target.closest("[data-open-thread]");
  const edit = e.target.closest("[data-edit]"), remove = e.target.closest("[data-delete]");
  if (send_) send(send_.dataset.send);
  else if (status) post({ kind: "status", thread: status.dataset.status, status: status.dataset.to, author: "human" });
  else if (open) openThread(open.dataset.openThread);
  else if (edit) {
    const [thread, message] = edit.dataset.edit.split("|"), m = threads.find((t) => t.id === thread)?.messages.find((x) => x.id === message);
    editing = { thread, message };
    drafts.set(`edit|${thread}|${message}`, m.content.text);
    renderPop();
    renderDetails();
    const box = document.querySelector(`[data-draft="${CSS.escape(`edit|${thread}|${message}`)}"]`);
    box?.focus();
    box?.setSelectionRange(box.value.length, box.value.length);
  } else if (remove) {
    const [thread, message] = remove.dataset.delete.split("|");
    post({ kind: "delete", thread, message, author: "human" });
  }
  return Boolean(send_ || status || open || edit || remove);
}
$("pop").addEventListener("click", (e) => { if (e.target.closest("[data-pop-close]")) pop(null); else threadClick(e); });
for (const box of [details, $("pop")]) {
  box.addEventListener("input", (e) => { if (e.target.dataset.draft) drafts.set(e.target.dataset.draft, e.target.value); });
  box.addEventListener("keydown", (e) => {
    const key = e.target.dataset.draft;
    if (!key) return;
    if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); send(key); }
    else if (e.key === "Escape") {
      e.stopPropagation();
      // 改到一半放弃：恢复原样；否则输入框失焦，气泡里的输入框连气泡一起收起。
      if (key.startsWith("edit|")) { drafts.delete(key); editing = null; renderPop(); renderDetails(); }
      else if (box === details) e.target.blur();
      else pop(null);
    }
  });
}
function setCommenting(on) {
  commenting = on;
  canvas.classList.toggle("commenting", on);
  $("commentTool").classList.toggle("on", on);
  if (!on && popped?.kind === "new") pop(null);
}
$("commentTool").onclick = () => setCommenting(!commenting);
$("threadsToggle").onclick = () => {
  listOpen = selected !== null || !listOpen;
  select(null);
};
function centerOn(id) {
  const el = stage.querySelector(`[data-node="${CSS.escape(id)}"]`);
  if (!el) return;
  const r = canvas.getBoundingClientRect(), b = el.getBoundingClientRect(), v = viewOf(current);
  views.set(current.id, { ...v, x: v.x + (r.left + r.width / 2) - (b.left + b.width / 2), y: v.y + (r.top + r.height / 2) - (b.top + b.height / 2) });
  apply();
}

// ---------- 键盘 ----------
window.addEventListener("keydown", (e) => {
  if (e.target instanceof HTMLInputElement || e.target instanceof HTMLTextAreaElement || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "/") { e.preventDefault(); if ($("app").classList.contains("nav-closed")) setNav(true); $("search").focus(); }
  else if (e.key === "b" || e.key === "B") setNav($("app").classList.contains("nav-closed"));
  else if (e.key === "c" || e.key === "C") setCommenting(!commenting);
  else if (e.key === "Escape") {
    // 由近到远地退：先收气泡，再关批注工具，再取消选中，最后收起全部批注。
    if (popped) pop(null);
    else if (commenting) setCommenting(false);
    else { if (!selected) listOpen = false; select(null); }
  }
  else if (e.key === "l" || e.key === "L") toggleLegend();
  else if (e.key === "f" || e.key === "F") fit();
  else if (e.key === "+" || e.key === "=") zoomCenter(1.25);
  else if (e.key === "-") zoomCenter(0.8);
  else if (e.key === "0") $("zoomReset").click();
  else if (e.key === "Backspace" && current?.parent) go(current.parent);
});

// ---------- 实时更新 ----------
function setStatus(kind, text, title = "") {
  const s = $("status");
  s.className = kind;
  $("statusText").textContent = text;
  s.title = title;
}
function renderProblems() {
  const box = $("problems");
  if (!site?.failed) { box.style.display = "none"; return; }
  box.innerHTML = `<h4>构建失败：显示的是上一版图。修好后会自动重画。</h4>${esc(site.diagnostics.join("\n"))}`;
  box.style.display = "block";
}
$("status").addEventListener("click", () => { const box = $("problems"); if (site?.failed) box.style.display = box.style.display === "none" ? "block" : "none"; });
let loaded = -1;
async function load() {
  const next = await (await fetch("/api/site")).json();
  loaded = next.version;
  site = next;
  const keep = current?.id;
  current = null;
  if (site.diagrams.length === 0) { stage.innerHTML = ""; $("empty").style.display = "flex"; $("empty").textContent = site.failed ? "构建失败，还没有可显示的图" : "设计里还没有图"; }
  else if (!location.hash && keep === undefined) go(site.diagrams[0].id, null, true);
  else route();
  renderLists($("search").value);
  renderProblems();
  setStatus(site.failed ? "failed" : "", site.failed ? `构建失败 · ${site.diagnostics.length} 条诊断` : `实时 · ${site.diagrams.length} 张图${site.diagnostics.length ? ` · ${site.diagnostics.length} 条诊断` : ""}`, site.diagnostics.join("\n"));
}
function connect() {
  const events = new EventSource("/events");
  events.addEventListener("site", (e) => {
    const { version, building } = JSON.parse(e.data);
    if (building) setStatus("building", "重画中…");
    if (!building && version !== loaded) load();
    else if (!building && site) setStatus(site.failed ? "failed" : "", $("statusText").textContent === "重画中…" ? `实时 · ${site.diagrams.length} 张图` : $("statusText").textContent);
  });
  events.addEventListener("threads", loadThreads);
  events.onerror = () => setStatus("offline", "已断开，重连中…");
}
connect();
</script>

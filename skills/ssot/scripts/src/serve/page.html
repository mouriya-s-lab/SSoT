<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>SSoT</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --ink: #1f2933; --muted: #5f6b77; --line: #e3e7ec; --panel: #f7f9fb; --accent: #1168bd; --hot: #d9480f;
    --bad: #c92a2a; --ok: #2b8a3e; --warn: #e67700;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif;
    font-size: 14px; color: var(--ink);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; }
  #app { display: grid; grid-template-columns: 280px 1fr auto; grid-template-rows: auto 1fr; height: 100%; }
  #app.nav-closed { grid-template-columns: 0 1fr auto; }
  #app.nav-closed nav { display: none; }
  header { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 8px 14px; border-bottom: 1px solid var(--line); min-height: 52px; }
  header button svg { display: block; }
  header .brand { font-weight: 700; letter-spacing: .02em; }
  #crumbs { display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; }
  #crumbs a { color: var(--accent); text-decoration: none; cursor: pointer; }
  #crumbs a:hover { text-decoration: underline; }
  #crumbs .sep { color: #aab4be; }
  #crumbs .here { font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
  #status { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); cursor: default; padding: 4px 8px; border-radius: 12px; background: var(--panel); }
  #status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
  #status.building .dot { background: var(--warn); animation: pulse 1s infinite; }
  #status.failed { color: var(--bad); cursor: pointer; }
  #status.failed .dot { background: var(--bad); }
  #status.offline .dot { background: #adb5bd; }
  @keyframes pulse { 50% { opacity: .3; } }
  .tools { display: flex; gap: 4px; }
  button { font: inherit; border: 1px solid var(--line); background: #fff; border-radius: 6px; padding: 4px 9px; cursor: pointer; color: var(--ink); }
  button:hover { background: var(--panel); }
  nav { grid-column: 1; border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  #search { margin: 10px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; font: inherit; }
  #lists { overflow: auto; flex: 1; padding-bottom: 12px; }
  nav h3 { margin: 12px 14px 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  nav a { display: block; padding: 5px 14px 5px 18px; color: var(--ink); text-decoration: none; cursor: pointer; border-left: 3px solid transparent; }
  nav a small { display: block; color: var(--muted); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  nav a .fold { display: inline-block; width: 16px; margin-left: -16px; color: var(--muted); font: 400 14px/1 Menlo, monospace; text-align: center; }
  nav a .fold:hover { color: var(--ink); }
  nav a .count { float: right; min-width: 18px; padding: 0 5px; margin-left: 6px; border-radius: 9px; background: var(--hot); color: #fff; font-size: 11px; font-weight: 600; text-align: center; line-height: 18px; }
  nav a:hover { background: #eef2f6; }
  nav a.active { border-left-color: var(--accent); background: #e7f0fa; font-weight: 600; }
  nav a.hit mark { background: #ffe8a1; color: inherit; }
  main { grid-column: 2; position: relative; overflow: hidden; background: #fbfcfd; cursor: grab; }
  main.panning { cursor: grabbing; }
  #stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #stage svg { display: block; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  #stage [data-node]:not([data-frame]), #stage [data-edge], #stage [data-header] { cursor: pointer; transition: opacity .12s; }
  #stage.focus [data-node]:not([data-frame]):not(.hot), #stage.focus [data-edge]:not(.hot) { opacity: .16; }
  #stage [data-edge].hot path[stroke="#5d6b78"], #stage [data-edge].hot path[stroke="#59636e"] { stroke: var(--hot); stroke-width: 2.6; }
  #stage [data-node].picked > :first-child { stroke: var(--hot) !important; stroke-width: 3 !important; }
  #stage .drill { cursor: pointer; }
  #stage g.drill:hover rect { filter: brightness(.82); }
  #stage tspan.drill:hover { fill: var(--hot); }
  #stage .pin { cursor: pointer; }
  #stage .pin circle { fill: var(--accent); stroke: #fff; stroke-width: 2; }
  #stage .pin.waiting circle { fill: var(--hot); }
  #stage .pin text { fill: #fff; font: 700 12px -apple-system, sans-serif; pointer-events: none; }
  #hint { position: absolute; left: 12px; bottom: 10px; font-size: 12px; color: var(--muted); background: rgba(255,255,255,.85); padding: 4px 8px; border-radius: 6px; pointer-events: none; }
  #tip { position: absolute; pointer-events: none; max-width: 360px; background: #1f2933; color: #fff; font-size: 12.5px; padding: 6px 9px; border-radius: 6px; display: none; z-index: 5; line-height: 1.45; }
  #tip b { color: #ffd8a8; }
  aside { grid-column: 3; width: 0; overflow: hidden; border-left: 1px solid var(--line); background: #fff; }
  aside.open { width: 360px; overflow: auto; }
  aside .inner { padding: 14px 16px 24px; width: 360px; }
  aside h2 { margin: 0 0 2px; font-size: 18px; }
  aside .kind { color: var(--muted); font-size: 12.5px; margin-bottom: 10px; }
  aside p { margin: 8px 0 12px; line-height: 1.55; }
  aside dl { display: grid; grid-template-columns: 96px 1fr; gap: 4px 10px; margin: 0 0 12px; font-size: 13px; }
  aside dt { color: var(--muted); }
  aside dd { margin: 0; word-break: break-word; }
  aside .links a { display: block; margin: 4px 0; color: var(--accent); cursor: pointer; text-decoration: none; }
  aside .links a:hover { text-decoration: underline; }
  aside .close { float: right; }
  aside .rel { border-top: 1px solid var(--line); padding: 8px 0; font-size: 13px; }
  aside .threads { border-top: 1px solid var(--line); margin-top: 14px; padding-top: 2px; }
  aside .threads.solo { border-top: 0; margin-top: 0; padding-top: 0; }
  aside .threads h3 { margin: 10px 0 8px; font-size: 13px; }
  aside .threads.solo h3 { margin-top: 2px; font-size: 18px; }
  aside textarea { display: block; width: 100%; min-height: 34px; padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; font: inherit; resize: vertical; field-sizing: content; }
  aside textarea:focus { outline: 2px solid #b6d4f5; border-color: var(--accent); }
  aside .actions { display: flex; align-items: center; gap: 8px; margin: 6px 0 12px; }
  aside .actions .keys { color: var(--muted); font-size: 12px; }
  aside .thread { border: 1px solid var(--line); border-left: 3px solid var(--hot); border-radius: 6px; padding: 8px 10px 0; margin-bottom: 10px; }
  aside .thread.answered { border-left-color: var(--accent); }
  aside .thread.resolved { border-left-color: var(--ok); opacity: .75; }
  aside .thread .head { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
  aside .thread .where { display: block; margin: 3px 0 4px; color: var(--accent); cursor: pointer; font-size: 12.5px; text-decoration: none; }
  aside .thread .where:hover { text-decoration: underline; }
  aside .msg { margin: 6px 0 8px; font-size: 13px; }
  aside .msg b { margin-right: 6px; }
  aside .msg.agent b { color: var(--accent); }
  aside .msg time { color: var(--muted); font-size: 11.5px; }
  aside .msg .text { margin-top: 2px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
  aside .resolved-toggle { display: block; margin: 4px 0 10px; color: var(--muted); font-size: 12.5px; cursor: pointer; }
  aside .none { color: var(--muted); }
  #threadsToggle { display: flex; align-items: center; gap: 5px; }
  #threadsToggle.waiting { border-color: var(--hot); color: var(--hot); }
  #problems { position: absolute; left: 12px; right: 12px; top: 12px; max-height: 45%; overflow: auto; background: #fff5f5; border: 1px solid #ffc9c9; color: #7d1414; border-radius: 8px; padding: 10px 14px; font: 12px/1.5 ui-monospace, Menlo, monospace; white-space: pre-wrap; display: none; z-index: 4; }
  #problems h4 { margin: 0 0 6px; font: 600 13px -apple-system, sans-serif; }
  #empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); }
</style>
</head>
<body>
<div id="app">
  <header>
    <button id="navToggle" title="收起或展开侧栏 (B)" aria-label="收起或展开侧栏"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="1.5" y="2.5" width="13" height="11" rx="2"/><path d="M6 2.5v11"/></svg></button>
    <span class="brand">SSoT</span>
    <div id="crumbs"></div>
    <div class="tools">
      <button id="zoomOut" title="缩小 (-)">−</button>
      <button id="zoomReset" title="实际大小 (0)">100%</button>
      <button id="zoomIn" title="放大 (+)">+</button>
      <button id="fit" title="适应窗口 (F)">适应</button>
      <button id="download" title="下载当前图的 SVG">SVG</button>
    </div>
    <button id="threadsToggle" title="全部批注；按 C 对选中的元素或当前这张图批注"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M2.5 3.5h11v7.5h-6l-3 2.5v-2.5h-2z"/></svg><span id="threadCount">0</span></button>
    <div id="status" title=""><span class="dot"></span><span id="statusText">连接中</span></div>
  </header>
  <nav>
    <input id="search" placeholder="搜索图与元素（/）" autocomplete="off">
    <div id="lists"></div>
  </nav>
  <main id="canvas">
    <div id="stage"></div>
    <div id="empty">正在构建…</div>
    <div id="problems"></div>
    <div id="tip"></div>
    <div id="hint">拖动平移 · 滚轮平移 / ⌘ 或 Ctrl + 滚轮缩放 · 单击看详情 · 点图上的标注或双击下钻 · C 批注 · B 收起侧栏 · Esc 取消</div>
  </main>
  <aside id="details"><div class="inner"></div></aside>
</div>
<script>
"use strict";
const KIND_TITLES = { view: "C4 视图", deployment: "部署", layers: "契约", box: "契约", promises: "契约", types: "契约", access: "契约", wirings: "接线", composition: "接线", properties: "接线" };
const $ = (id) => document.getElementById(id);
const canvas = $("canvas"), stage = $("stage"), details = $("details"), tip = $("tip");
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

let site = null;                 // /api/site 的最近一次结果
let current = null;              // 当前图
let selected = null;             // { type: "node" | "edge", id }
const views = new Map();         // 图 id → { x, y, scale }：每张图各自记住视野，重画后不跳
let threads = [];                // /api/threads 的最近一次结果：使用者留的批注与 agent 的回复
let threadsOpen = false;         // 没有选中元素时，右栏是否列出全部批注
let showResolved = false;
const drafts = new Map();        // 输入框的键 → 还没发出的字；右栏随时会重画，字不能丢

// ---------- 路由：#/<图 id>?node=<节点 id> ----------
function parseHash() {
  const raw = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
  const [id, query] = raw.split("?");
  const node = new URLSearchParams(query ?? "").get("node");
  return { id: id || null, node };
}
function go(id, node = null, replace = false) {
  const hash = `#/${encodeURIComponent(id)}${node ? `?node=${encodeURIComponent(node)}` : ""}`;
  if (replace) history.replaceState(null, "", hash); else if (location.hash !== hash) history.pushState(null, "", hash);
  route();
}
window.addEventListener("popstate", route);

function route() {
  if (!site || site.diagrams.length === 0) return;
  const { id, node } = parseHash();
  const diagram = site.diagrams.find((d) => d.id === id) ?? site.diagrams[0];
  // 走到一张图时展开它在侧栏树里的各级上级，否则当前图会藏在收起的分支里。
  if (diagram.id !== revealed) {
    revealed = diagram.id;
    for (let d = diagram; d?.parent; d = site.diagrams.find((x) => x.id === d.parent)) folded.delete(d.parent);
    localStorage.setItem("ssot.folded", JSON.stringify([...folded]));
  }
  // 选中状态先按地址定下来再画图：详情面板的开合会改变画布宽度，适应窗口要按最终宽度算。
  const pick = node && diagram.items[node] ? { type: "node", id: node } : null;
  if (!current || current !== diagram) { selected = pick; renderDetails(); show(diagram); }
  else select(pick);
  if (pick) centerOn(pick.id);
}

// ---------- 侧栏 ----------
// 整栏的开合与树上收起的分支记在 localStorage：它们是这个浏览器里的看图习惯，不属于设计。
const folded = new Set(JSON.parse(localStorage.getItem("ssot.folded") ?? "[]"));
let revealed = null;             // 最近一次为它展开过上级的图
function setNav(open) {
  const before = canvas.getBoundingClientRect().left;
  $("app").classList.toggle("nav-closed", !open);
  localStorage.setItem("ssot.nav", open ? "open" : "closed");
  // 画布的左边界跟着移动；每张图的视野补上这段位移，图在屏幕上不跳。
  const shift = before - canvas.getBoundingClientRect().left;
  for (const [id, v] of views) views.set(id, { ...v, x: v.x + shift });
  apply();
}
$("app").classList.toggle("nav-closed", localStorage.getItem("ssot.nav") === "closed");
$("navToggle").onclick = () => setNav($("app").classList.contains("nav-closed"));
function renderLists(filter = "") {
  const q = filter.trim().toLowerCase();
  const lists = $("lists");
  let html = "";
  // 每张图上未解决的批注数。
  const counts = new Map();
  for (const t of threads) if (t.status === "open") counts.set(t.anchor.diagram, (counts.get(t.anchor.diagram) ?? 0) + 1);
  const count = (d) => counts.has(d.id) ? `<span class="count" title="未解决的批注">${counts.get(d.id)}</span>` : "";
  const entry = (d, depth, parent) => `<a data-go="${esc(d.id)}" class="${current?.id === d.id ? "active" : ""}" style="padding-left:${32 + depth * 16}px">${count(d)}${parent ? `<span class="fold" data-fold="${esc(d.id)}" title="${folded.has(d.id) ? "展开" : "收起"}下一层">${folded.has(d.id) ? "▸" : "▾"}</span>` : ""}${esc(d.title)}<small>${esc(d.id)}</small></a>`;
  // 不搜索时按上下级排成树：每张图缩进在它的上一级图下面，只有顶层的图分组加标题。
  if (!q) {
    const all = site?.diagrams ?? [], ids = new Set(all.map((d) => d.id)), children = new Map(), roots = [];
    for (const d of all) {
      if (d.parent && ids.has(d.parent)) { if (!children.has(d.parent)) children.set(d.parent, []); children.get(d.parent).push(d); }
      else roots.push(d);
    }
    const walk = (d, depth) => {
      const below = children.get(d.id) ?? [];
      html += entry(d, depth, below.length > 0);
      if (!folded.has(d.id)) for (const c of below) walk(c, depth + 1);
    };
    let heading = null;
    for (const r of roots) {
      if (KIND_TITLES[r.kind] !== heading) { heading = KIND_TITLES[r.kind]; html += `<h3>${esc(heading)}</h3>`; }
      walk(r, 0);
    }
    lists.innerHTML = html;
    return;
  }
  const groups = new Map();
  for (const d of site?.diagrams ?? []) {
    const title = KIND_TITLES[d.kind];
    if (!groups.has(title)) groups.set(title, []);
    groups.get(title).push(d);
  }
  const mark = (text) => q ? esc(text).replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "ig"), (m) => `<mark>${m}</mark>`) : esc(text);
  for (const [title, diagrams] of groups) {
    const shown = q ? diagrams.filter((d) => `${d.title} ${d.id}`.toLowerCase().includes(q)) : diagrams;
    if (shown.length === 0) continue;
    html += `<h3>${esc(title)}</h3>`;
    for (const d of shown) html += `<a data-go="${esc(d.id)}" class="${current?.id === d.id ? "active" : ""} ${q ? "hit" : ""}">${count(d)}${mark(d.title)}<small>${esc(d.id)}</small></a>`;
  }
  if (q) {
    const hits = [];
    for (const d of site?.diagrams ?? []) for (const [id, item] of Object.entries(d.items))
      if (`${item.title} ${item.kind} ${item.description} ${id}`.toLowerCase().includes(q)) hits.push({ d, id, item });
    if (hits.length) {
      html += `<h3>元素</h3>`;
      for (const { d, id, item } of hits.slice(0, 80)) html += `<a class="hit" data-go="${esc(d.id)}" data-node="${esc(id)}">${mark(item.title)}<small>${esc(d.title)} · ${esc(item.kind)}</small></a>`;
    }
    if (!html) html = `<h3>没有匹配</h3>`;
  }
  lists.innerHTML = html;
}
$("lists").addEventListener("click", (e) => {
  const fold = e.target.closest("[data-fold]");
  if (fold) {
    if (!folded.delete(fold.dataset.fold)) folded.add(fold.dataset.fold);
    localStorage.setItem("ssot.folded", JSON.stringify([...folded]));
    return renderLists($("search").value);
  }
  const a = e.target.closest("a[data-go]");
  if (a) go(a.dataset.go, a.dataset.node ?? null);
});
$("search").addEventListener("input", (e) => renderLists(e.target.value));
$("search").addEventListener("keydown", (e) => {
  if (e.key === "Enter") { const first = $("lists").querySelector("a[data-go]"); if (first) go(first.dataset.go, first.dataset.node ?? null); }
  if (e.key === "Escape") { e.target.value = ""; renderLists(); e.target.blur(); }
});

// ---------- 面包屑 ----------
function renderCrumbs() {
  const chain = [];
  for (let d = current; d; d = d.parent ? site.diagrams.find((x) => x.id === d.parent) : null) chain.unshift(d);
  $("crumbs").innerHTML = chain.map((d, i) => i === chain.length - 1
    ? `<span class="here" title="${esc(d.description)}">${esc(d.title)}</span>`
    : `<a data-go="${esc(d.id)}">${esc(d.title)}</a><span class="sep">›</span>`).join("");
}
$("crumbs").addEventListener("click", (e) => { const a = e.target.closest("a[data-go]"); if (a) go(a.dataset.go); });

// ---------- 画布：平移与缩放 ----------
function viewOf(d) { return views.get(d.id); }
function apply() {
  if (!current) return;
  const v = viewOf(current), svg = stage.querySelector("svg");
  if (!svg) return;
  svg.style.width = `${current.width * v.scale}px`;
  svg.style.height = `${current.height * v.scale}px`;
  stage.style.transform = `translate(${v.x}px, ${v.y}px)`;
  $("zoomReset").textContent = `${Math.round(v.scale * 100)}%`;
}
function fit() {
  if (!current) return;
  const r = canvas.getBoundingClientRect(), pad = 24;
  const scale = Math.min((r.width - pad * 2) / current.width, (r.height - pad * 2) / current.height, 1.5);
  views.set(current.id, { scale, x: (r.width - current.width * scale) / 2, y: Math.max(pad, (r.height - current.height * scale) / 2) });
  apply();
}
function zoomAt(factor, cx, cy) {
  const v = viewOf(current), scale = Math.min(6, Math.max(0.08, v.scale * factor)), k = scale / v.scale;
  views.set(current.id, { scale, x: cx - (cx - v.x) * k, y: cy - (cy - v.y) * k });
  apply();
}
function zoomCenter(factor) { const r = canvas.getBoundingClientRect(); zoomAt(factor, r.width / 2, r.height / 2); }
canvas.addEventListener("wheel", (e) => {
  if (!current) return;
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  if (e.ctrlKey || e.metaKey) zoomAt(Math.exp(-e.deltaY * 0.01), e.clientX - r.left, e.clientY - r.top);
  else { const v = viewOf(current); views.set(current.id, { ...v, x: v.x - e.deltaX, y: v.y - e.deltaY }); apply(); }
}, { passive: false });
let drag = null;
canvas.addEventListener("pointerdown", (e) => {
  if (e.button !== 0 || !current) return;
  drag = { x: e.clientX, y: e.clientY, moved: false, start: { ...viewOf(current) } };
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener("pointermove", (e) => {
  if (!drag) return hover(e);
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.moved && Math.hypot(dx, dy) < 4) return;
  drag.moved = true;
  canvas.classList.add("panning");
  views.set(current.id, { ...drag.start, x: drag.start.x + dx, y: drag.start.y + dy });
  apply();
});
canvas.addEventListener("pointerup", (e) => {
  const was = drag; drag = null; canvas.classList.remove("panning");
  if (was && !was.moved) click(e);
});
$("zoomIn").onclick = () => zoomCenter(1.25);
$("zoomOut").onclick = () => zoomCenter(0.8);
$("zoomReset").onclick = () => { const r = canvas.getBoundingClientRect(), v = viewOf(current); zoomAt(1 / v.scale, r.width / 2, r.height / 2); };
$("fit").onclick = fit;
$("download").onclick = () => {
  if (!current) return;
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([current.svg], { type: "image/svg+xml" }));
  a.download = `${current.id.replace(/[:/]/g, "-")}.svg`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};
window.addEventListener("resize", () => { if (current && !views.has(current.id)) fit(); });

// ---------- 显示一张图 ----------
function show(diagram) {
  const first = !views.has(diagram.id);
  current = diagram;
  tip.style.display = "none";
  hovered = null;
  stage.innerHTML = diagram.svg;
  $("empty").style.display = "none";
  if (first) fit(); else apply();
  renderPins();
  renderCrumbs();
  renderLists($("search").value);
  if (selected && !(selected.type === "node" ? diagram.items[selected.id] : diagram.edges[selected.id])) select(null);
  else select(selected);
  document.title = `${diagram.title} · SSoT`;
}

// ---------- 悬停：高亮相连的线与节点 ----------
function targetOf(e) {
  // 拖动时画布捕获了指针，事件的 target 是画布本身；按指针位置取真正的元素。
  const el = document.elementFromPoint(e.clientX, e.clientY);
  if (!el || !stage.contains(el)) return null;
  e = { target: el };
  // 图钉：一个节点或一条箭头上有未解决的批注；点它等于点那个元素。
  const pin = el.closest(".pin");
  if (pin) return { type: pin.dataset.pinType, id: pin.dataset.pinType === "edge" ? Number(pin.dataset.pinId) : pin.dataset.pinId };
  // 图上的下钻标注（SVG 里 class="drill"）：打开下一层的图，并定位到其中的节点。
  const drill = e.target.closest?.(".drill");
  if (drill) return { type: "drill", id: drill.dataset.open, node: drill.dataset.openNode ?? null };
  const edge = e.target.closest?.("[data-edge]");
  if (edge) return { type: "edge", id: Number(edge.dataset.edge) };
  const header = e.target.closest?.("[data-header]");
  if (header && current.items[header.dataset.header]) return { type: "node", id: header.dataset.header };
  const node = e.target.closest?.("[data-node]");
  if (node) return { type: "node", id: node.dataset.node };
  return null;
}
function related(t) {
  const nodes = new Set(), edges = new Set();
  if (!t) return { nodes, edges };
  if (t.type === "node") {
    nodes.add(t.id);
    current.edges.forEach((e, i) => { if (e.source === t.id || e.target === t.id) { edges.add(i); nodes.add(e.source); nodes.add(e.target); } });
  } else if (t.type === "edge") {
    const e = current.edges[t.id];
    if (e) { edges.add(t.id); nodes.add(e.source); nodes.add(e.target); }
  }
  return { nodes, edges };
}
function paint(t) {
  const { nodes, edges } = related(t);
  stage.classList.toggle("focus", nodes.size + edges.size > 0);
  for (const el of stage.querySelectorAll("[data-node]")) el.classList.toggle("hot", nodes.has(el.dataset.node));
  for (const el of stage.querySelectorAll("[data-edge]")) el.classList.toggle("hot", edges.has(Number(el.dataset.edge)));
}
let hovered = null;
function hover(e) {
  if (!current) return;
  const t = targetOf(e);
  const key = t ? `${t.type}:${t.id}` : null;
  if (key !== hovered) { hovered = key; paint(t && t.type !== "drill" ? t : selected); }
  if (t && t.type !== "drill") {
    const r = canvas.getBoundingClientRect();
    tip.innerHTML = tipText(t);
    tip.style.display = tip.innerHTML ? "block" : "none";
    tip.style.left = `${Math.min(e.clientX - r.left + 14, r.width - 370)}px`;
    tip.style.top = `${e.clientY - r.top + 14}px`;
  } else tip.style.display = "none";
}
canvas.addEventListener("pointerleave", () => { hovered = null; tip.style.display = "none"; paint(selected); });
function tipText(t) {
  if (t.type === "node") {
    const item = current.items[t.id];
    return item ? `<b>${esc(item.title)}</b> · ${esc(item.kind)}${item.description ? `<br>${esc(item.description)}` : ""}` : "";
  }
  const e = current.edges[t.id];
  if (!e) return "";
  const name = (id) => current.items[id]?.title ?? id;
  const rel = e.relations.map((r) => `${esc(r.title || "—")}${r.description ? `<br><span style="opacity:.8">${esc(r.description)}</span>` : ""}`).join("<br>");
  return `<b>${esc(name(e.source))} → ${esc(name(e.target))}</b><br>${rel || esc(e.label ?? "")}`;
}

// ---------- 单击选中、双击下钻 ----------
function click(e) {
  const t = targetOf(e);
  if (t?.type === "drill") return go(t.id, t.node);
  select(t);
  history.replaceState(null, "", `#/${encodeURIComponent(current.id)}${t?.type === "node" ? `?node=${encodeURIComponent(t.id)}` : ""}`);
}
canvas.addEventListener("dblclick", (e) => {
  const t = targetOf(e);
  if (t?.type !== "node") return;
  const drill = stage.querySelector(`.drill[data-primary][data-of="${CSS.escape(t.id)}"]`);
  if (drill) go(drill.dataset.open, drill.dataset.openNode ?? null);
});
function select(t) {
  selected = t;
  for (const el of stage.querySelectorAll(".picked")) el.classList.remove("picked");
  if (t?.type === "node") for (const el of stage.querySelectorAll(`[data-node="${CSS.escape(t.id)}"]`)) el.classList.add("picked");
  paint(t);
  renderDetails();
}
function renderDetails() {
  const inner = details.querySelector(".inner");
  // agent 的回复随时会推过来并重画右栏：记下正在输入的那个框，重画后把光标放回去。
  const typing = document.activeElement?.dataset?.draft ?? null;
  const html = current ? detailsHtml() : null;
  if (html === null) { details.classList.remove("open"); inner.innerHTML = ""; return; }
  inner.innerHTML = html;
  details.classList.add("open");
  const box = typing === null ? null : inner.querySelector(`[data-draft="${CSS.escape(typing)}"]`);
  if (box) { box.focus(); box.setSelectionRange(box.value.length, box.value.length); }
}
/** 右栏的内容：选中元素的详情加指向它的批注；没有选中时是全部批注；null：收起。 */
function detailsHtml() {
  let html = `<button class="close" id="closeDetails">✕</button>`;
  if (!selected) return threadsOpen ? html + threadsHtml() : null;
  if (selected.type === "node") {
    const item = current.items[selected.id];
    if (!item) return null;
    html += `<h2>${esc(item.title)}</h2><div class="kind">${esc(item.kind)}</div>`;
    if (item.description) html += `<p>${esc(item.description)}</p>`;
    if (item.facts.length) html += `<dl>${item.facts.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>`;
    if (item.links.length) html += `<div class="links">${item.links.map((l) => `<a data-go="${esc(l.diagram)}">→ ${esc(l.label)}</a>`).join("")}</div>`;
  } else {
    const e = current.edges[selected.id];
    if (!e) return null;
    const name = (id) => current.items[id]?.title ?? id;
    html += `<h2>${esc(name(e.source))} → ${esc(name(e.target))}</h2><div class="kind">${esc(e.label ?? "")}</div>`;
    for (const r of e.relations) html += `<div class="rel"><b>${esc(r.title || "—")}</b><br>${esc(r.source)} → ${esc(r.target)}${r.description ? `<p>${esc(r.description)}</p>` : ""}</div>`;
    html += `<div class="links"><a data-pick="${esc(e.source)}">← ${esc(name(e.source))}</a><a data-pick="${esc(e.target)}">→ ${esc(name(e.target))}</a></div>`;
  }
  return html + threadsHtml();
}
details.addEventListener("click", (e) => {
  if (e.target.id === "closeDetails") { threadsOpen = false; return select(null); }
  const send_ = e.target.closest("[data-send]");
  if (send_) return send(send_.dataset.send);
  const status = e.target.closest("[data-status]");
  if (status) return post({ kind: "status", thread: status.dataset.status, status: status.dataset.to });
  const where = e.target.closest("[data-anchor]");
  if (where) return openAnchor(threads.find((t) => t.id === where.dataset.anchor).anchor);
  const go_ = e.target.closest("a[data-go]");
  if (go_) return go(go_.dataset.go);
  const pick = e.target.closest("a[data-pick]");
  if (pick) { select({ type: "node", id: pick.dataset.pick }); centerOn(pick.dataset.pick); }
});
details.addEventListener("input", (e) => { if (e.target.dataset.draft) drafts.set(e.target.dataset.draft, e.target.value); });
details.addEventListener("change", (e) => { if (e.target.id === "showResolved") { showResolved = e.target.checked; renderDetails(); } });
details.addEventListener("keydown", (e) => {
  const key = e.target.dataset.draft;
  if (!key) return;
  if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); send(key); }
  else if (e.key === "Escape") e.target.blur();
});

// ---------- 批注 ----------
// 批注指向一张图、图上的一个节点或一条箭头；箭头用两端的节点 id 加它在同一对端点之间的序号认，重画后下标变了也找得回来。
function anchorOf(t) {
  if (!t) return { kind: "diagram", diagram: current.id };
  if (t.type === "node") return { kind: "node", diagram: current.id, node: t.id };
  const e = current.edges[t.id];
  let ordinal = 0;
  for (let i = 0; i < t.id; i++) if (current.edges[i].source === e.source && current.edges[i].target === e.target) ordinal++;
  return { kind: "edge", diagram: current.id, source: e.source, target: e.target, ordinal };
}
const anchorKey = (a) => a.kind === "diagram" ? `d|${a.diagram}` : a.kind === "node" ? `n|${a.diagram}|${a.node}` : `e|${a.diagram}|${a.source}|${a.target}|${a.ordinal}`;
/** 批注指向的元素在图 d 上现在是哪一个；null：指向整张图，或那个元素已经不在图上。 */
function targetOfAnchor(d, a) {
  if (a.kind === "node") return d.items[a.node] ? { type: "node", id: a.node } : null;
  if (a.kind !== "edge") return null;
  let seen = 0;
  for (let i = 0; i < d.edges.length; i++) if (d.edges[i].source === a.source && d.edges[i].target === a.target && seen++ === a.ordinal) return { type: "edge", id: i };
  return null;
}
function anchorLabel(a) {
  const d = site.diagrams.find((x) => x.id === a.diagram);
  if (!d) return `${a.diagram}（现在的设计里没有这张图）`;
  if (a.kind === "diagram") return `${d.title} · 整张图`;
  const name = (id) => d.items[id]?.title ?? id;
  return `${d.title} › ${a.kind === "node" ? name(a.node) : `${name(a.source)} → ${name(a.target)}`}${targetOfAnchor(d, a) ? "" : "（已经不在图上）"}`;
}
function openAnchor(a) {
  const d = site.diagrams.find((x) => x.id === a.diagram);
  if (!d) return;
  const t = targetOfAnchor(d, a);
  go(d.id, t?.type === "node" ? t.id : null);
  if (t?.type === "edge") select(t);
}
/** 一条未解决的批注在等谁：最后一句是使用者说的，就在等 agent。 */
const waitsOnAgent = (t) => t.messages[t.messages.length - 1].author === "human";
function when(at) {
  const d = new Date(at), two = (n) => String(n).padStart(2, "0");
  return `${two(d.getMonth() + 1)}-${two(d.getDate())} ${two(d.getHours())}:${two(d.getMinutes())}`;
}
function threadHtml(t, where) {
  const open = t.status === "open";
  let html = `<div class="thread ${open ? (waitsOnAgent(t) ? "" : "answered") : "resolved"}"><div class="head"><span>${esc(t.id)}</span><span>${open ? (waitsOnAgent(t) ? "等 agent 回复" : "agent 已回复") : "已解决"}</span></div>`;
  if (where) html += `<a class="where" data-anchor="${esc(t.id)}">${esc(anchorLabel(t.anchor))}</a>`;
  for (const m of t.messages) html += `<div class="msg ${m.author}"><b>${m.author === "human" ? "你" : "Agent"}</b><time>${when(m.at)}</time><div class="text">${esc(m.text)}</div></div>`;
  html += `<textarea data-draft="reply|${esc(t.id)}" rows="1" placeholder="回复…">${esc(drafts.get(`reply|${t.id}`) ?? "")}</textarea>`;
  return html + `<div class="actions"><button data-send="reply|${esc(t.id)}">回复</button><button data-status="${esc(t.id)}" data-to="${open ? "resolved" : "open"}">${open ? "标为已解决" : "重新打开"}</button></div></div>`;
}
function threadsHtml() {
  // 选中了元素：只列指向它的批注；没有选中：列全部，当前这张图的排在前面。
  const key = anchorKey(anchorOf(selected));
  const listed = selected ? threads.filter((t) => anchorKey(t.anchor) === key) : [...threads].sort((a, b) => (b.anchor.diagram === current.id) - (a.anchor.diagram === current.id));
  const open = listed.filter((t) => t.status === "open"), resolved = listed.filter((t) => t.status === "resolved");
  let html = `<div class="threads${selected ? "" : " solo"}"><h3>${selected ? "批注" : "全部批注"}</h3>`;
  html += `<textarea data-draft="new|${esc(key)}" rows="2" placeholder="${selected ? "这里哪里不对？" : `对整张图「${esc(current.title)}」批注；要指到某个节点或箭头，先在图上点它`}">${esc(drafts.get(`new|${key}`) ?? "")}</textarea>`;
  html += `<div class="actions"><button data-send="new|${esc(key)}">批注</button><span class="keys">⌘ 或 Ctrl + Enter 发出</span></div>`;
  for (const t of open) html += threadHtml(t, !selected);
  if (resolved.length) {
    html += `<label class="resolved-toggle"><input type="checkbox" id="showResolved"${showResolved ? " checked" : ""}> 已解决 ${resolved.length} 条</label>`;
    if (showResolved) for (const t of resolved) html += threadHtml(t, !selected);
  }
  if (listed.length === 0) html += `<p class="none">${selected ? "这里还没有批注。" : "还没有批注。"}</p>`;
  return html + `</div>`;
}
/** 发出一个输入框里的字：新批注落在当前选中的元素上（没有选中时是当前这张图），回复落在那条批注下面。 */
async function send(key) {
  const text = (drafts.get(key) ?? "").trim();
  if (!text) return;
  await post(key.startsWith("reply|") ? { kind: "reply", thread: key.slice(6), author: "human", text } : { kind: "open", anchor: anchorOf(selected), author: "human", text }, () => drafts.delete(key));
}
/** 把一次改动交给 ssot serve；成功后先执行 done 再按返回的批注重画。 */
async function post(change, done = () => {}) {
  let response, answer;
  try {
    response = await fetch("/api/threads", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(change) });
    answer = await response.json();
  } catch {
    return alert("没有发出去：ssot serve 没有回应");
  }
  if (!response.ok) return alert(`没有发出去：${answer.error}`);
  done();
  setThreads(answer.threads);
}
function setThreads(next) {
  threads = next;
  const open = threads.filter((t) => t.status === "open");
  $("threadCount").textContent = open.length;
  $("threadsToggle").classList.toggle("waiting", open.some(waitsOnAgent));
  renderPins();
  renderLists($("search").value);
  renderDetails();
}
async function loadThreads() { setThreads((await (await fetch("/api/threads")).json()).threads); }
/** 当前这张图上，每个带未解决批注的节点或箭头画一个图钉，写着条数；有在等 agent 的是橙色。 */
function renderPins() {
  const svg = stage.querySelector("svg");
  if (!svg || !current) return;
  for (const el of svg.querySelectorAll(".pin")) el.remove();
  const pinned = new Map();
  for (const t of threads) {
    const target = t.status === "open" && t.anchor.diagram === current.id ? targetOfAnchor(current, t.anchor) : null;
    if (!target) continue;
    const key = `${target.type}:${target.id}`;
    if (!pinned.has(key)) pinned.set(key, { target, on: [] });
    pinned.get(key).on.push(t);
  }
  // 位置按屏幕上的矩形换算回 SVG 的坐标：节点与箭头的标签在右上角，没有标签的箭头在线的中点。
  const box = svg.getBoundingClientRect(), scale = box.width / current.width;
  for (const { target, on } of pinned.values()) {
    let at;
    if (target.type === "node") {
      const id = CSS.escape(target.id), el = svg.querySelector(`[data-node="${id}"]:not([data-frame])`) ?? svg.querySelector(`[data-node="${id}"]`);
      if (!el) continue;
      const b = el.getBoundingClientRect();
      at = { x: b.right, y: b.top };
    } else {
      const parts = [...svg.querySelectorAll(`[data-edge="${target.id}"]`)], label = parts.find((g) => !g.querySelector("path")), path = svg.querySelector(`[data-edge="${target.id}"] path`);
      if (label) { const b = label.getBoundingClientRect(); at = { x: b.right, y: b.top }; }
      else if (path) at = path.getPointAtLength(path.getTotalLength() / 2).matrixTransform(path.getScreenCTM());
      else continue;
    }
    const pin = document.createElementNS("http://www.w3.org/2000/svg", "g");
    pin.setAttribute("class", on.some(waitsOnAgent) ? "pin waiting" : "pin");
    pin.setAttribute("transform", `translate(${(at.x - box.left) / scale},${(at.y - box.top) / scale})`);
    pin.dataset.pinType = target.type;
    pin.dataset.pinId = target.id;
    pin.innerHTML = `<circle r="11"/><text text-anchor="middle" dy="4">${on.length}</text>`;
    svg.append(pin);
  }
}
/** C：对选中的元素批注；没有选中时对当前这张图。 */
function compose() {
  if (!current) return;
  if (!selected) threadsOpen = true;
  renderDetails();
  details.querySelector('textarea[data-draft^="new|"]')?.focus();
}
$("threadsToggle").onclick = () => {
  threadsOpen = selected !== null || !threadsOpen;
  select(null);
};
function centerOn(id) {
  const el = stage.querySelector(`[data-node="${CSS.escape(id)}"]`);
  if (!el) return;
  const r = canvas.getBoundingClientRect(), b = el.getBoundingClientRect(), v = viewOf(current);
  views.set(current.id, { ...v, x: v.x + (r.left + r.width / 2) - (b.left + b.width / 2), y: v.y + (r.top + r.height / 2) - (b.top + b.height / 2) });
  apply();
}

// ---------- 键盘 ----------
window.addEventListener("keydown", (e) => {
  if (e.target instanceof HTMLInputElement || e.target instanceof HTMLTextAreaElement || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "/") { e.preventDefault(); if ($("app").classList.contains("nav-closed")) setNav(true); $("search").focus(); }
  else if (e.key === "b" || e.key === "B") setNav($("app").classList.contains("nav-closed"));
  else if (e.key === "c" || e.key === "C") { e.preventDefault(); compose(); }
  else if (e.key === "Escape") { if (!selected) threadsOpen = false; select(null); }
  else if (e.key === "f" || e.key === "F") fit();
  else if (e.key === "+" || e.key === "=") zoomCenter(1.25);
  else if (e.key === "-") zoomCenter(0.8);
  else if (e.key === "0") $("zoomReset").click();
  else if (e.key === "Backspace" && current?.parent) go(current.parent);
});

// ---------- 实时更新 ----------
function setStatus(kind, text, title = "") {
  const s = $("status");
  s.className = kind;
  $("statusText").textContent = text;
  s.title = title;
}
function renderProblems() {
  const box = $("problems");
  if (!site?.failed) { box.style.display = "none"; return; }
  box.innerHTML = `<h4>构建失败：显示的是上一版图。修好后会自动重画。</h4>${esc(site.diagnostics.join("\n"))}`;
  box.style.display = "block";
}
$("status").addEventListener("click", () => { const box = $("problems"); if (site?.failed) box.style.display = box.style.display === "none" ? "block" : "none"; });
let loaded = -1;
async function load() {
  const next = await (await fetch("/api/site")).json();
  loaded = next.version;
  site = next;
  const keep = current?.id;
  current = null;
  if (site.diagrams.length === 0) { stage.innerHTML = ""; $("empty").style.display = "flex"; $("empty").textContent = site.failed ? "构建失败，还没有可显示的图" : "设计里还没有图"; }
  else if (!location.hash && keep === undefined) go(site.diagrams[0].id, null, true);
  else route();
  renderLists($("search").value);
  renderProblems();
  setStatus(site.failed ? "failed" : "", site.failed ? `构建失败 · ${site.diagnostics.length} 条诊断` : `实时 · ${site.diagrams.length} 张图${site.diagnostics.length ? ` · ${site.diagnostics.length} 条诊断` : ""}`, site.diagnostics.join("\n"));
}
function connect() {
  const events = new EventSource("/events");
  events.addEventListener("site", (e) => {
    const { version, building } = JSON.parse(e.data);
    if (building) setStatus("building", "重画中…");
    if (!building && version !== loaded) load();
    else if (!building && site) setStatus(site.failed ? "failed" : "", $("statusText").textContent === "重画中…" ? `实时 · ${site.diagrams.length} 张图` : $("statusText").textContent);
  });
  events.addEventListener("threads", loadThreads);
  events.onerror = () => setStatus("offline", "已断开，重连中…");
}
connect();
</script>
</body>
</html>
